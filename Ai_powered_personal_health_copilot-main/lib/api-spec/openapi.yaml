openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: Authenticated patient profile
  - name: documents
    description: Private medical document records and AI extraction
  - name: feedback
    description: Patient feedback
  - name: admin
    description: Single-authorized-admin patient and product analytics
  - name: translations
    description: Database-backed interface translations
  - name: storage
    description: Private medical document upload
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: Profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "401":
          description: Authentication required
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Update the current user's language preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List the current user's medical documents
      responses:
        "200":
          description: Medical documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicalDocument"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Add a private medical document after upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MedicalDocumentInput"
      responses:
        "201":
          description: Document created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalDocument"
  /documents/{id}:
    get:
      operationId: getDocument
      tags: [documents]
      summary: Get a document owned by the current user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Medical document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalDocument"
        "404":
          description: Document not found
    delete:
      operationId: deleteDocument
      tags: [documents]
      summary: Delete a document owned by the current user
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
  /documents/{id}/analyze:
    post:
      operationId: analyzeDocument
      tags: [documents]
      summary: Extract and explain medical information from a document
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAnalysisInput"
      responses:
        "200":
          description: AI-assisted extraction draft for patient review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalDocument"
  /documents/{id}/confirm:
    patch:
      operationId: confirmDocument
      tags: [documents]
      summary: Save patient-verified extracted information
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentConfirmation"
      responses:
        "200":
          description: Confirmed medical document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalDocument"
  /feedback:
    get:
      operationId: listMyFeedback
      tags: [feedback]
      summary: List feedback from the current patient
      responses:
        "200":
          description: Patient feedback
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PatientFeedback"
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Submit patient feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientFeedback"
  /translations/{locale}:
    get:
      operationId: getTranslations
      tags: [translations]
      summary: Get database-backed translations for a supported locale
      parameters:
        - in: path
          name: locale
          required: true
          schema:
            type: string
            enum: [en, hi, ta, te, kn]
      responses:
        "200":
          description: Translation dictionary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslationDictionary"
  /languages:
    get:
      operationId: listLanguages
      tags: [translations]
      summary: List enabled application languages
      responses:
        "200":
          description: Enabled language records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Language"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a private presigned URL for uploading a medical document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Get database-derived user registration analytics
      responses:
        "200":
          description: User registration analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Admin access required
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List user registration records for the authorized admin
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - name: search
          in: query
          schema: { type: string, maxLength: 200 }
        - name: role
          in: query
          schema: { type: string, enum: [patient, admin] }
        - name: status
          in: query
          schema: { type: string, enum: [active, inactive] }
        - name: sortBy
          in: query
          schema: { type: string, enum: [id, name, email, role, createdAt, lastSeenAt], default: createdAt }
        - name: sortOrder
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
      responses:
        "200":
          description: Paginated user registration records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsersPage"
        "403":
          description: Admin access required
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Profile:
      type: object
      required: [id, email, name, locale, role]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        locale: { type: string, enum: [en, hi, ta, te, kn] }
        role: { type: string, enum: [patient, admin] }
        createdAt: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      required: [locale]
      properties:
        locale: { type: string, enum: [en, hi, ta, te, kn] }
    MedicalDocument:
      type: object
      required: [id, fileName, documentType, status, createdAt]
      properties:
        id: { type: string }
        fileName: { type: string }
        documentType: { type: string, enum: [prescription, lab_report, discharge_summary, diagnostic_report, other] }
        status: { type: string, enum: [uploaded, processing, review_required, confirmed, failed] }
        createdAt: { type: string, format: date-time }
        extractedText: { type: [string, "null"] }
        summary: { type: [string, "null"] }
        translatedSummary: { type: [string, "null"] }
        summaryLocale: { type: [string, "null"] }
        extraction: { type: [object, "null"], additionalProperties: true }
        confidence: { type: [number, "null"] }
        requiresReview: { type: boolean }
    MedicalDocumentInput:
      type: object
      required: [fileName, objectPath, documentType]
      properties:
        fileName: { type: string, minLength: 1, maxLength: 255 }
        objectPath: { type: string, minLength: 1, maxLength: 2048 }
        documentType: { type: string, enum: [prescription, lab_report, discharge_summary, diagnostic_report, other] }
    DocumentAnalysisInput:
      type: object
      required: [locale]
      properties:
        locale: { type: string, enum: [en, hi, ta, te, kn] }
    DocumentConfirmation:
      type: object
      required: [extraction, summary, summaryLocale]
      properties:
        extraction: { type: object, additionalProperties: true }
        summary: { type: string, minLength: 1, maxLength: 10000 }
        summaryLocale: { type: string, enum: [en, hi, ta, te, kn] }
    FeedbackInput:
      type: object
      required: [message]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        category: { type: string, enum: [experience, accuracy, accessibility, other] }
        message: { type: string, minLength: 2, maxLength: 4000 }
    PatientFeedback:
      type: object
      required: [id, category, message, createdAt]
      properties:
        id: { type: string }
        category: { type: string }
        rating: { type: [integer, "null"] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
    TranslationDictionary:
      type: object
      additionalProperties:
        type: string
    Language:
      type: object
      required: [id, name, code, nativeName, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        code: { type: string, enum: [en, hi, ta, te, kn] }
        nativeName: { type: string }
        enabled: { type: boolean }
    AdminOverview:
      type: object
      required: [totalUsers, totalPatients, totalAdmins, registrationsToday, registrationsThisWeek, registrationsThisMonth, activeUsers, inactiveUsers, dailyRegistrations, weeklyRegistrations, monthlyRegistrations]
      properties:
        totalUsers: { type: integer }
        totalPatients: { type: integer }
        totalAdmins: { type: integer }
        registrationsToday: { type: integer }
        registrationsThisWeek: { type: integer }
        registrationsThisMonth: { type: integer }
        activeUsers: { type: integer }
        inactiveUsers: { type: integer }
        dailyRegistrations:
          type: array
          items:
            type: object
            required: [period, count]
            properties:
              period: { type: string }
              count: { type: integer }
        weeklyRegistrations:
          type: array
          items:
            type: object
            required: [period, count]
            properties:
              period: { type: string }
              count: { type: integer }
        monthlyRegistrations:
          type: array
          items:
            type: object
            required: [period, count]
            properties:
              period: { type: string }
              count: { type: integer }
    AdminUser:
      type: object
      required: [id, email, name, role, createdAt, lastSeenAt, status]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [patient, admin] }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        status: { type: string, enum: [active, inactive] }
    AdminUsersPage:
      type: object
      required: [users, total, page, pageSize, totalPages]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
        totalPages: { type: integer }
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 15000000 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, application/pdf] }
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
